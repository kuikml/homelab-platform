---
- name: Ensure python3-kubernetes is installed on localhost
  ansible.builtin.pip:
    name: kubernetes
    executable: pip3
    extra_args: --break-system-packages
  delegate_to: localhost
  become: false

- name: Create argocd namespace
  kubernetes.core.k8s:
    name: argocd
    api_version: v1
    kind: Namespace
    state: present
    kubeconfig: /home/ubuntu/.kube/config
  delegate_to: localhost
  become: false

- name: Apply Argo CD manifests
  kubernetes.core.k8s:
    state: present
    src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
    namespace: argocd
    kubeconfig: /home/ubuntu/.kube/config
  delegate_to: localhost
  become: false

- name: Wait for Argo CD server pod to be ready
  kubernetes.core.k8s_info:
    kind: Pod
    namespace: argocd
    label_selectors:
      - app.kubernetes.io/name = argocd-server
    kubeconfig: /home/ubuntu/.kube/config
  register: argocd_server_pod
  until: >
    argocd_server_pod.resources | length > 0 and
    (argocd_server_pod.resources[0].status.containerStatuses[0].ready | default(false))
  retries: 30
  delay: 10
  delegate_to: localhost
  become: false