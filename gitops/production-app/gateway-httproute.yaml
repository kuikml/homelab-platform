apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web-app-route
  namespace: production-app
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: homelab-gateway
    namespace: argocd-ingress
  hostnames:
  - "app.homelab.local"
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: web-app-svc
      port: 80