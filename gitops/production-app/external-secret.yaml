apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: app-db-external-secret
  namespace: production-app
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: app-db-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: homelab-rds-master-password-v1
        property: password