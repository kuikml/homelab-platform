name: "Deploy Homelab Infrastructure & K3s"

on:
  push:
    branches: [ "main" ]
  paths:
    - 'terraform/**'
    - 'ansible/**'
    - '.github/workflows/**'
  workflow_dispatch: # Przycisk "Run workflow" w panelu GitHub


jobs:
  deploy:
    name: "Deploy Infrastructure & K3s"
    runs-on: self-hosted

    env:
      TF_VAR_pm_api_url: ${{ secrets.PM_API_URL }}
      TF_VAR_pm_api_token_id: ${{ secrets.PM_API_TOKEN_ID }}
      TF_VAR_pm_api_token_secret: ${{ secrets.PM_API_TOKEN_SECRET }}
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Wdrożenie maszyn przez Terraforma
      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Wait for K3s nodes SSH to be ready
        run: |
          echo "Waiting for SSH to become available on all K3s nodes..."
          for ip in 192.168.1.151 192.168.1.152 192.168.1.153; do
            echo "Checking $ip..."
            until nc -z -v -w5 $ip 22 2>/dev/null; do
              echo "SSH on $ip not ready yet, retrying in 5 seconds..."
              sleep 5
            done
            echo "SSH on $ip is READY!"
          done

      # 2. Konfiguracja klastra przez Ansible
      - name: Run Ansible Provisioning
        run: |
          cd ansible
          ansible-playbook -i inventories/ site.yml

      # 3. Test działania klastra K3s
      - name: Check K3s Nodes Status
        run: |
          kubectl get nodes -o wide
          kubectl get pods -A